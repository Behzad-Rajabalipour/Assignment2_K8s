# name: Terraform and Docker CI/CD Pipeline

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  infrastructure:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    environment: staging
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1  # Set the region here
    
    outputs:
      EC2_PUBLIC_IP: ${{ env.EC2_PUBLIC_IP }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.8'
    
      - name: Install AWS CLI and Boto3
        run: |
          pip install awscli boto3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Capture Terraform Outputs
        id: capture_terraform_outputs
        run: |
          echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV
        working-directory: ./terraform


  docker_build_push:
    name: Build and Push Docker Images to ECR
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: staging
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      SSH_USER: ec2-user  # Adjust based on your EC2 instance's user
      AWS_REGION: us-east-1  # Set the region here

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images
        run: |
          for service in web_app dbs_app; do
            docker build -t 097656145156.dkr.ecr.us-east-1.amazonaws.com/$service:latest -f Dockerfile_${service} .
            docker push 097656145156.dkr.ecr.us-east-1.amazonaws.com/$service:latest
          done

  deploy_to_ec2:
      name: Deploy to EC2 and Run docker-compose
      needs: docker_build_push
      runs-on: ubuntu-latest
      environment: staging
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        EC2_PUBLIC_IP: ${{ env.EC2_PUBLIC_IP }}
        SSH_USER: ec2-user  # Adjust based on your EC2 instance's user
        AWS_REGION: us-east-1

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v3

        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "$EC2_KEY" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key
          env:
            EC2_KEY: ${{ secrets.EC2_Key }}

        - name: SSH into EC2 and Run docker-compose
          run: |
            ssh -o StrictHostKeyChecking=no $SSH_USER@$EC2_PUBLIC_IP << 'EOF'
              cd /path/to/your/project
              docker-compose down
              docker-compose up -d
            EOF
          env:
            SSH_USER: ec2-user  # Adjust based on your EC2 instance's user
            EC2_PUBLIC_IP: ${{ env.EC2_PUBLIC_IP }}